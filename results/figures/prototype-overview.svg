<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17324D}.title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#586777}.h{font-size:17px;font-weight:700}.lab{font-size:13px}.small{font-size:12px;fill:#586777}.val{font-size:12px;font-weight:700}.axis{stroke:#D5DEE5;stroke-width:1}.navy{fill:#17324D}.teal{fill:#168B8A}.light{fill:#A3D9D5}.bg{fill:#fff}.panel{fill:#fff;stroke:#E3E9ED;stroke-width:1.2}</style>
<rect class="bg" width="1200" height="690"/>
<text class="title" x="55" y="48">Prototype 3D-to-2D craniofacial comparison</text>
<text class="sub" x="55" y="76">Two CBCT scans · historical proof-of-concept results · repeated same-scan processing and one exploratory between-case comparison</text>

<rect class="panel" x="55" y="110" width="520" height="240" rx="6"/>
<text class="h" x="80" y="142">A  Comparison time</text>
<text class="small" x="80" y="164">Saved comparison time only; segmentation/projection generation excluded</text>
<text class="lab" x="80" y="207">Person1 repeat</text><rect class="navy" x="205" y="190" width="300" height="14"/><rect class="teal" x="205" y="211" width="4" height="14"/><text class="val" x="512" y="202">608.8 s</text><text class="val" x="216" y="223">7.9 s</text>
<text class="lab" x="80" y="259">Person2 repeat</text><rect class="navy" x="205" y="242" width="222" height="14"/><rect class="teal" x="205" y="263" width="3" height="14"/><text class="val" x="434" y="254">449.9 s</text><text class="val" x="216" y="275">6.8 s</text>
<text class="lab" x="80" y="311">P1 vs P2</text><rect class="navy" x="205" y="294" width="193" height="14"/><rect class="teal" x="205" y="315" width="4" height="14"/><text class="val" x="405" y="306">392.5 s</text><text class="val" x="216" y="327">7.8 s</text>

<rect class="panel" x="600" y="110" width="545" height="240" rx="6"/>
<text class="h" x="625" y="142">B  Stored output size (run 1)</text>
<text class="small" x="625" y="164">Historical NIfTI-mask output versus PNG-projection output</text>
<text class="lab" x="625" y="220">Person1</text><rect class="navy" x="710" y="199" width="340" height="16"/><rect class="teal" x="710" y="225" width="3" height="16"/><text class="val" x="1058" y="212">160.34 MiB</text><text class="val" x="720" y="238">1.03 MiB</text>
<text class="lab" x="625" y="290">Person2</text><rect class="navy" x="710" y="269" width="253" height="16"/><rect class="teal" x="710" y="295" width="2" height="16"/><text class="val" x="971" y="282">119.27 MiB</text><text class="val" x="720" y="308">0.88 MiB</text>

<rect class="panel" x="55" y="380" width="1090" height="235" rx="6"/>
<text class="h" x="80" y="414">C  Projection overlap</text>
<text class="small" x="80" y="436">Repeated same-scan overlap assesses computational repeatability, not identification accuracy</text>
<line class="axis" x1="330" y1="575" x2="1080" y2="575"/>
<text class="small" x="325" y="595">0</text><text class="small" x="690" y="595">0.5</text><text class="small" x="1065" y="595">1.0</text>
<text class="lab" x="80" y="480">Person1 repeat</text><rect class="teal" x="330" y="464" width="750" height="13"/><rect class="light" x="330" y="481" width="750" height="13"/><text class="val" x="1090" y="476">Dice ≈1.00</text><text class="val" x="1090" y="493">IoU ≈1.00</text>
<text class="lab" x="80" y="531">Person2 repeat</text><rect class="teal" x="330" y="515" width="750" height="13"/><rect class="light" x="330" y="532" width="750" height="13"/><text class="val" x="1090" y="527">Dice ≈1.00</text><text class="val" x="1090" y="544">IoU ≈1.00</text>
<text class="lab" x="80" y="565">P1 vs P2</text><rect class="teal" x="330" y="552" width="243" height="13"/><rect class="light" x="330" y="569" width="235" height="13"/><text class="val" x="585" y="564">0.324</text><text class="val" x="585" y="581">0.313</text>

<rect class="navy" x="55" y="640" width="14" height="14"/><text class="small" x="78" y="652">3D masks</text>
<rect class="teal" x="160" y="640" width="14" height="14"/><text class="small" x="183" y="652">2D projections / Dice</text>
<rect class="light" x="350" y="640" width="14" height="14"/><text class="small" x="373" y="652">IoU</text>
<text class="small" x="565" y="652">Exploratory two-case prototype; between-case scores may reflect alignment, FOV and acquisition geometry as well as anatomy.</text>
</svg>